<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <!-- head -->
  <circle cx="17" cy="5" r="2.6" fill="currentColor" stroke="none"/>
  <!-- body leaning forward -->
  <line x1="16" y1="8" x2="12" y2="16"/>
  <!-- right arm back -->
  <line x1="15" y1="11" x2="10" y2="13"/>
  <!-- left arm forward-up -->
  <line x1="14" y1="10" x2="19" y2="8"/>
  <!-- right leg forward-down -->
  <line x1="12" y1="16" x2="17" y2="22"/>
  <line x1="17" y1="22" x2="20" y2="25"/>
  <!-- left leg back -->
  <line x1="12" y1="16" x2="8" y2="20"/>
  <line x1="8" y1="20" x2="6" y2="24"/>
</svg>
