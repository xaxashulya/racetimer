<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <!-- head -->
  <circle cx="10" cy="5.5" r="2.6" fill="currentColor" stroke="none"/>
  <!-- body slightly hunched / stopping -->
  <line x1="10" y1="8" x2="10" y2="17"/>
  <!-- one arm raised with stop-palm -->
  <line x1="10" y1="10" x2="18" y2="9"/>
  <!-- stop palm: small horizontal bar at end of arm -->
  <line x1="18" y1="7" x2="18" y2="11" stroke-width="2.2"/>
  <!-- other arm down -->
  <line x1="10" y1="12" x2="7" y2="16"/>
  <!-- legs stopped / uneven -->
  <line x1="10" y1="17" x2="7" y2="24"/>
  <line x1="10" y1="17" x2="13" y2="24"/>
</svg>
