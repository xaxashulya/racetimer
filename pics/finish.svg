<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <!-- finish tape across top -->
  <line x1="2" y1="10" x2="26" y2="10" stroke-dasharray="3 2.2" stroke-width="2.2"/>
  <!-- head -->
  <circle cx="14" cy="5" r="2.6" fill="currentColor" stroke="none"/>
  <!-- body breaking tape -->
  <line x1="14" y1="8" x2="14" y2="17"/>
  <!-- arms raised in V -->
  <line x1="14" y1="11" x2="8" y2="7"/>
  <line x1="14" y1="11" x2="20" y2="7"/>
  <!-- legs striding through -->
  <line x1="14" y1="17" x2="10" y2="24"/>
  <line x1="14" y1="17" x2="18" y2="23"/>
</svg>
