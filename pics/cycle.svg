<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <!-- head -->
  <circle cx="18" cy="5" r="2.4" fill="currentColor" stroke="none"/>
  <!-- helmet arc -->
  <path d="M16 4.5 Q18 2.2 20 4.5" stroke-width="1.4"/>
  <!-- rear wheel -->
  <circle cx="7" cy="20" r="5.5"/>
  <!-- front wheel -->
  <circle cx="21" cy="20" r="5.5"/>
  <!-- frame: rear axle -> bottom bracket -> seat tube up -> head tube -> front fork -->
  <polyline points="7,20 14,20 16,13 10,12"/>
  <line x1="14" y1="20" x2="21" y2="20"/>
  <!-- seat stays -->
  <line x1="7" y1="20" x2="10" y2="12"/>
  <!-- fork -->
  <line x1="18" y1="9" x2="21" y2="20"/>
  <!-- handlebar -->
  <line x1="18" y1="9" x2="21" y2="10"/>
  <!-- rider body: hips at BB, torso forward, arms to bars -->
  <line x1="14" y1="20" x2="16" y2="13"/>
  <line x1="16" y1="13" x2="20" y2="10"/>
  <!-- legs: one down, one up -->
  <line x1="14" y1="20" x2="11" y2="23"/>
  <line x1="14" y1="20" x2="17" y2="17"/>
</svg>
